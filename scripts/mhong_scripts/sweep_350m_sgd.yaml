program: torchrun_main2_sweep.py
name: Sweep_350M_SGD
method: grid
metric:
  name: loss
  goal: minimize
parameters:
  lr:
    values: [0.0001, 0.0005, 0.001, 0.003, 0.005, 0.01]
  
  beta1:
    values: [0, 0.9]


command:
  - torchrun
  - --standalone
  - --nproc_per_node=4
  - ${program}
  - "--wandb_project_name=$project"
  - "--model_name=full-rank_sgd"
  - "--model_config=configs/llama_350m.json"
  - "--peft_model=full-rank"
  - "--optimizer=sgd"
  - "--batch_size=128"
  - "--total_batch_size=512"
  - "--num_training_steps=60000"
  - "--cycle_length=60000"
  - "--warmup_steps=6000"
  - "--eval_every=1000"
  - "--dtype=bfloat16"
  - "--save_every=99999"
  - "--restart_every=99999"
  - "--scheduler=cosine"
  - "--seed=42"
  - "--dataset_path=/code/hongpaul-sandbox/parameter_efficient_pretraining/c4/en"