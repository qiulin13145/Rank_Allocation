program: torchrun_main2_sweep.py
name: 350M_Stable-SPAM-Full-Rank
method: grid
metric:
  name: loss
  goal: minimize
parameters:
  lr:
    values: [0.0001, 0.0004, 0.001, 0.003, 0.005, 0.01, 0.02]


command:
  - torchrun
  - --standalone
  - --nproc_per_node=4
  - ${program}
  - "--wandb_project_name=$project"
  - "--model_name=stalbe-spam-full-rank"
  - "--model_config=configs/llama_350m.json"
  - "--peft_model=full-rank"
  - "--optimizer=stable_spam_adamw"
  - "--batch_size=128"
  - "--total_batch_size=512" 
  - "--num_training_steps=60000"
  - "--warmup_steps=6000"
  - "--eval_every=1000"
  - "--dtype=bfloat16"
  - "--cycle_length=60000"
  - "--scheduler=cosine"
  - "--save_every=99999"
  - "--density=1.0"
  - "--update_gap=500"
  - "--gamma1=0.85"  
  - "--gamma2=0.99999"
  - "--gamma3=0.999"
  - "--total_T=60000"
  - "--eta=0.5"
  - "--density=1.0"
  - "--update_gap=1000"
  - "--dataset_path=/code/hongpaul-sandbox/parameter_efficient_pretraining/c4/en"
