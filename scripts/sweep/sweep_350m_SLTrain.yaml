program: torchrun_main2_sweep.py
name: 350M_SLTrain
method: grid
metric:
  name: loss
  goal: minimize
parameters:
  lr:
    values: [0.001, 0.003, 0.005, 0.01]
  rank:
    values: [256, 128, 64]
  lora_alpha:
    values: [16]
  sp_ratio:
    values: [0.1]
  

command:
  - torchrun
  - --standalone 
  - --nproc_per_node=4
  - ${program}
  - "--wandb_project_name=$project"
  - "--model_name=restart_SLTrain"
  - "--model_config=configs/llama_350m.json"
  - "--peft_model=sltrain"
  - "--optimizer=adamw"
  - "--batch_size=64"
  - "--total_batch_size=512" 
  - "--num_training_steps=60000"
  - "--warmup_steps=6000"
  - "--eval_every=1000"
  - "--dtype=bfloat16"
  - "--save_every=99999"
  - "--scheduler=cosine"
  - "--dataset_path=/home/mhong/shared/glent007/c4/en"