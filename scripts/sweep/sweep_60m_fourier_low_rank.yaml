program: torchrun_main_DDP_sweep.py
method: bayes
metric:
  name: loss
  goal: minimize
parameters:
  lr:
    values: [0.0005, 0.001, 0.002, 0.003, 0.005, 0.01]
  rank:
    values: [32, 64, 128, 256]
  lora_alpha:
    values: [8, 16, 32, 64]
  n_freq:
    values: [1000, 5000, 10000, 50000, 100000]
  fourier_scale:
    values: [16, 32, 64, 128]


command:
  - torchrun
  - --standalone 
  - --nproc_per_node=2
  - ${program}
  - "--wandb_project_name=$project"
  - "--model_name=fourier_low_rank"
  - "--model_config=configs/llama_60m.json"
  - "--peft_model=fourier_low_rank"
  - "--optimizer=adamw"
  - "--batch_size=256"
  - "--total_batch_size=512" 
  - "--num_training_steps=11000"
  - "--warmup_steps=1"
  - "--eval_every=1100"
  - "--dtype=bfloat16"