program: torchrun_main_DDP_sweep.py
method: grid
metric:
  name: loss
  goal: minimize
parameters:
  lr:
    values: [0.0005, 0.001, 0.002, 0.003, 0.005, 0.01]
  rank:
    values: [32, 64, 128, 256]
  lora_alpha:
    values: [8, 16, 32, 64]
  sp_ratio:
    values: [0.01, 0.03, 0.05, 0.1]
  


command:
  - torchrun
  - --standalone 
  - --nproc_per_node=4
  - ${program}
  - "--wandb_project_name=$project"
  - "--model_name=sltrain"
  - "--model_config=configs/llama_60m.json"
  - "--peft_model=sltrain"
  - "--optimizer=adamw"
  - "--batch_size=128"
  - "--total_batch_size=512" 
  - "--num_training_steps=11000"
  - "--warmup_steps=1"
  - "--eval_every=1000"
  - "--dtype=bfloat16"
  - "--sp_ratio=0.03" 