program: torchrun_main2_sweep.py
name: 130M_Low-Rank-restarts
method: grid
metric:
  name: loss
  goal: minimize
parameters:
  lr:
    values: [0.0005, 0.001, 0.003, 0.005]
  rank:
    values: [256, 128, 64]
  lora_alpha:
    values: [16]
  cycle_length:
    values: [200]
  


command:
  - torchrun
  - --standalone 
  - --nproc_per_node=4
  - ${program}
  - "--wandb_project_name=$project"
  - "--model_name=restart_lora"
  - "--model_config=configs/llama_130m.json"
  - "--peft_model=restart_lora"
  - "--optimizer=adamw"
  - "--batch_size=128"
  - "--total_batch_size=512" 
  - "--num_training_steps=20000"
  - "--warmup_steps=2000"
  - "--eval_every=1000"
  - "--dtype=bfloat16"
  - "--save_every=99999"
  - "--restart_warmup_steps=10"
  - "--scheduler=cosine_quick_recovery"