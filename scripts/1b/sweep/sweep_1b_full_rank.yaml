program: torchrun_main_fsdp.py
method: grid
metric:
  name: loss
  goal: minimize
parameters:
  lr:
    values: [0.0003, 0.0005, 0.001, 0.002, 0.003]


command:
  - torchrun
  - --standalone
  - --nproc_per_node=4
  - ${program}
  - "--wandb_project_name=sweep-full-rank-1b"
  - "--model_name=full-rank"
  - "--model_config=configs/llama_1b.json"
  - "--peft_model=full-rank"
  - "--optimizer=adamw"
  - "--batch_size=32"
  - "--total_batch_size=512"
  - "--num_training_steps=10000"
  - "--warmup_steps=1000"
  - "--eval_every=1000"
  - "--dtype=bfloat16"
